<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DiGraphLab Harmony Viewer</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.js"></script>
  <link href="https://unpkg.com/vis-network@9.1.2/dist/vis-network.min.css" rel="stylesheet" type="text/css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #mynetwork { width: 100%; height: 100vh; border: 1px solid lightgray; }
  </style>
</head>
<body>
  <div id="mynetwork"></div>
  <script>
    let network = null;

    function buildGraph(model) {
      // model: { Nodes: [{Id, Representative:{Traditional,Nashville,RootPc,PitchClasses,Quality,Inversion}, Count, Styles}], Edges: [{From,To,Weight,Count}] }
      const nodes = model.Nodes.map(n => ({ id: n.Id, label: n.Representative.Traditional + '\n' + n.Representative.Nashville, title: JSON.stringify(n.Representative), value: Math.max(1, n.Count) }));
      const edges = model.Edges.map(e => ({ from: e.From, to: e.To, title: `w=${e.Weight.toFixed(2)}, c=${e.Count}`, value: Math.max(1, 1 / (1 + e.Weight)) }));
      const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
      const options = { physics: { stabilization: true, barnesHut: { gravitationalConstant: -2000 } }, edges: { smooth: true }, nodes: { shape: 'box' } };
      const container = document.getElementById('mynetwork');
      if (network) { network.destroy(); }
      network = new vis.Network(container, data, options);
      network.on('click', function (params) {
        if (params.nodes && params.nodes.length) {
          const id = params.nodes[0];
          const node = model.Nodes.find(n => n.Id === id);
          if (node) {
            alert('Node: ' + id + '\n' + 'Traditional: ' + node.Representative.Traditional + '\n' + 'Nashville: ' + node.Representative.Nashville + '\n' + 'Quality: ' + node.Representative.Quality + '\n' + 'PitchClasses: ' + node.Representative.PitchClasses.join(', '));
          }
        }
      });
    }

    // support WebView2 posting JSON message
    if (window.chrome && chrome.webview) {
      chrome.webview.addEventListener('message', event => {
        try {
          const data = event.data;
          buildGraph(data);
        } catch (e) {
          console.error(e);
        }
      });
    } else {
      // fallback: look for a global variable "initialModel"
      if (window.initialModel) buildGraph(window.initialModel);
    }
  </script>
</body>
</html>
