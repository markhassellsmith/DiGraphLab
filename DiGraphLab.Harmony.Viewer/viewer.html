<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DiGraphLab Harmony Viewer</title>
    <script>
      // Attempt to load a bundled vis-network first (if provided), otherwise fall back to local renderer.
      (function(){
        var script = document.createElement('script');
        script.src = 'assets/vis/vis-network.min.js';
        script.onload = function(){ console.log('vis-network loaded'); };
        script.onerror = function(){
          var s = document.createElement('script'); s.src = 'assets/vis/vis-local.js'; document.head.appendChild(s);
        };
        document.head.appendChild(script);
      })();
    </script>
  <link href="assets/vis/vis-local.css" rel="stylesheet" type="text/css" />
  <style>
    html, body { height: 100%; margin: 0; }
    #mynetwork { width: 100%; height: 100vh; border: 1px solid lightgray; }
  </style>
</head>
<body>
  <div id="mynetwork"></div>
  <script>
    let network = null;

    let currentModel = null;
    let currentOptions = { notation: 'both', tonicPc: 0, preferSharps: true };

    function applyOptionsAndRender() {
      if (!currentModel) return;
      buildGraph(currentModel, currentOptions);
    }

    function buildGraph(model, options) {
      currentModel = model;
      currentOptions = options || currentOptions;
      // Build labels based on options
      const nodes = model.Nodes.map(n => {
        const trad = n.Representative.Traditional;
        const nash = n.Representative.Nashville;
        let label = '';
        if (options.notation === 'traditional') label = trad;
        else if (options.notation === 'nashville') label = nash;
        else label = trad + '\n' + nash;
        return { id: n.Id, label: label, title: JSON.stringify(n.Representative), value: Math.max(1, n.Count), rep: n.Representative };
      });
      const edges = model.Edges.map(e => ({ from: e.From, to: e.To, title: `w=${e.Weight.toFixed(2)}, c=${e.Count}`, value: Math.max(1, 1 / (1 + e.Weight)) }));
      const container = document.getElementById('mynetwork');
      // simple renderer using vis-local (or fallback)
      if (network) { network.destroy(); }
      network = new vis.Network(container, { nodes: nodes, edges: edges }, {});
      network.on('click', function (params) {
        if (params.nodes && params.nodes.length) {
          const id = params.nodes[0];
          const node = model.Nodes.find(n => n.Id === id);
          if (node) {
            // send to host
            const hostWebView = window.chrome && window.chrome.webview;
            if (hostWebView && typeof hostWebView.postMessage === 'function') {
              hostWebView.postMessage({ type: 'nodeClick', id: id, node: node });
            } else {
              alert('Node: ' + id + '\n' + 'Traditional: ' + node.Representative.Traditional + '\n' + 'Nashville: ' + node.Representative.Nashville + '\n' + 'Quality: ' + node.Representative.Quality + '\n' + 'PitchClasses: ' + node.Representative.PitchClasses.join(', '));
            }
          }
        }
      });
    }

    // support WebView2 posting JSON message
      if (window.chrome && chrome.webview) {
      chrome.webview.addEventListener('message', event => {
        try {
          const data = event.data;
          if (data && data.type === 'options') {
            // update options
            currentOptions = { notation: data.notation || currentOptions.notation, tonicPc: data.tonicPc ?? currentOptions.tonicPc, preferSharps: data.preferSharps ?? currentOptions.preferSharps };
            applyOptionsAndRender();
          } else {
            // assume model
            buildGraph(data, currentOptions);
          }
        } catch (e) {
          console.error(e);
        }
      });
    } else {
      // fallback: look for a global variable "initialModel"
      if (window.initialModel) buildGraph(window.initialModel);
    }

    // try enabling interactions (if local renderer provides it)
    setTimeout(function(){ if (window.vis && window.vis.Network && typeof window.vis.Network.prototype.enableInteractions === 'function') {
      // nothing, will be available on network instance
    }}, 500);
  </script>
</body>
</html>
